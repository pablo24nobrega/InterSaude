<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InterSaúde — Serviços Especializados</title>
<meta name="description" content="Fale com a InterSaúde pelo WhatsApp ou acompanhe nosso Instagram. Serviços de saúde especializados.">
<meta name="theme-color" content="#0C1246">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0C1246;
    --navy-soft:#1a2160;
    --teal:#44B4A8;
    --teal-deep:#2f8e84;
    --teal-tint:#E8F5F3;
    --wa:#25D366;
    --wa-deep:#1da851;
    --ink:#0C1246;
    --muted:#5a6480;
    --card:#ffffff;
    --ring:rgba(68,180,168,.35);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 20px;
    position:relative;
    overflow-x:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, #f3fbfa 0%, #eef6f8 38%, #e7eef6 100%);
  }

  /* ambient medical "+" texture, very faint */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-image:
      linear-gradient(var(--teal) 0 0),
      linear-gradient(var(--teal) 0 0);
    background-repeat:repeat;
    background-size:74px 74px, 74px 74px;
    /* fallback handled below with mask of crosses */
    opacity:0;
  }

  .bg-crosses{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    opacity:.05;
    color:var(--navy);
  }

  .glow{
    position:fixed; z-index:0; pointer-events:none;
    width:380px; height:380px; border-radius:50%;
    filter:blur(70px); opacity:.5;
  }
  .glow.a{ top:-120px; right:-110px; background:radial-gradient(circle,var(--teal),transparent 70%); }
  .glow.b{ bottom:-140px; left:-120px; background:radial-gradient(circle,#cfe0ff,transparent 70%); }

  .card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:430px;
    background:var(--card);
    border-radius:30px;
    padding:38px 28px 26px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 24px 60px -24px rgba(12,18,70,.32),
      0 4px 14px -8px rgba(12,18,70,.18);
    text-align:center;
    border:1px solid rgba(12,18,70,.05);
  }

  .logo-wrap{
    opacity:0; transform:translateY(10px) scale(.98);
    animation:rise .8s cubic-bezier(.2,.7,.2,1) .05s forwards;
  }
  .logo{
    width:min(78%,300px);
    height:auto;
    display:block;
    margin:0 auto;
  }

  /* heartbeat / pulse signature */
  .pulse{
    width:min(72%,260px);
    height:30px;
    margin:14px auto 4px;
    display:block;
    overflow:visible;
  }
  .pulse path{
    fill:none;
    stroke:var(--teal);
    stroke-width:2.4;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:340;
    stroke-dashoffset:340;
    animation:draw 1.9s ease-out .55s forwards;
  }
  .pulse circle{
    fill:var(--teal);
    opacity:0;
    animation:blip 2.2s ease-out .8s infinite;
  }

  .tagline{
    margin-top:6px;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--teal-deep);
    opacity:0;
    animation:rise .7s ease .35s forwards;
  }
  .lead{
    margin:12px auto 0;
    max-width:30ch;
    font-size:.98rem;
    line-height:1.55;
    color:var(--muted);
    font-weight:500;
    opacity:0;
    animation:rise .7s ease .45s forwards;
  }

  .links{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    gap:13px;
  }

  .btn{
    --d:0s;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    border-radius:18px;
    text-decoration:none;
    font-size:1rem;
    font-weight:700;
    letter-spacing:.01em;
    position:relative;
    transition:transform .18s ease, box-shadow .25s ease, filter .25s ease;
    opacity:0;
    transform:translateY(14px);
    animation:rise .6s cubic-bezier(.2,.7,.2,1) var(--d) forwards;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{ transform:translateY(1px) scale(.99); }

  .btn .ic{
    flex:0 0 auto;
    width:34px; height:34px;
    border-radius:11px;
    display:grid; place-items:center;
  }
  .btn .ic svg{ width:20px; height:20px; display:block; }

  .btn .txt{ flex:1 1 auto; text-align:left; line-height:1.15; }
  .btn .txt small{
    display:block;
    font-weight:600;
    font-size:.78rem;
    letter-spacing:.01em;
    opacity:.85;
    margin-top:2px;
  }
  .btn .arrow{
    flex:0 0 auto;
    opacity:.6;
    transition:transform .2s ease, opacity .2s ease;
  }
  .btn:hover .arrow{ transform:translateX(3px); opacity:1; }

  /* WhatsApp */
  .btn--wa{
    background:linear-gradient(180deg,var(--wa) 0%, var(--wa-deep) 100%);
    color:#fff;
    box-shadow:0 14px 26px -14px rgba(37,211,102,.85), 0 2px 6px -2px rgba(0,0,0,.12);
  }
  .btn--wa:hover{ filter:brightness(1.03); transform:translateY(-2px); box-shadow:0 20px 34px -16px rgba(37,211,102,.9); }
  .btn--wa .ic{ background:rgba(255,255,255,.2); color:#fff; }

  /* Instagram */
  .btn--ig{
    background:linear-gradient(180deg,var(--navy) 0%, #060a30 100%);
    color:#fff;
    box-shadow:0 14px 26px -16px rgba(12,18,70,.9), 0 2px 6px -2px rgba(0,0,0,.12);
  }
  .btn--ig:hover{ transform:translateY(-2px); box-shadow:0 20px 34px -16px rgba(12,18,70,.95); }
  .btn--ig .ic{ background:rgba(255,255,255,.12); color:#fff; }

  .foot{
    margin-top:24px;
    padding-top:18px;
    border-top:1px solid rgba(12,18,70,.08);
    font-size:.74rem;
    color:var(--muted);
    letter-spacing:.02em;
    opacity:0;
    animation:rise .7s ease .85s forwards;
  }
  .foot strong{ color:var(--navy); font-weight:800; }
  .foot .dot{ color:var(--teal); margin:0 6px; }

  @keyframes rise{ to{ opacity:1; transform:none; } }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes blip{
    0%,55%{ opacity:0; r:0; }
    62%{ opacity:1; }
    78%,100%{ opacity:0; r:5; }
  }

  @media (max-width:380px){
    .card{ padding:32px 20px 22px; border-radius:26px; }
    .btn{ font-size:.95rem; padding:15px 15px; }
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation:none !important; }
    .logo-wrap,.tagline,.lead,.btn,.foot{ opacity:1 !important; transform:none !important; }
    .pulse path{ stroke-dashoffset:0 !important; }
    .pulse circle{ opacity:0 !important; }
  }

  a.btn:focus-visible{ outline:3px solid var(--ring); outline-offset:3px; }
</style>
</head>
